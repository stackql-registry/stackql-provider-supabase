openapi: 3.0.0
info:
  title: secrets API
  description: Secrets related endpoints
  version: 1.0.0
paths:
  /v1/projects/{ref}/api-keys:
    get:
      operationId: v1-get-project-api-keys
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
        - name: reveal
          required: false
          in: query
          description: Boolean string, true or false
          schema:
            example: true
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
        - fga_permissions:
            - api_gateway_keys_read
      summary: Get project api keys
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:read'
          position: after
      x-endpoint-owners:
        - auth
        - management-api
      x-oauth-scope: secrets:read
    post:
      operationId: v1-create-project-api-key
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
        - name: reveal
          required: false
          in: query
          description: Boolean string, true or false
          schema:
            example: true
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyBody'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
        - fga_permissions:
            - api_gateway_keys_write
      summary: Creates a new API key for the project
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - auth
        - management-api
      x-oauth-scope: secrets:write
  /v1/projects/{ref}/api-keys/legacy:
    get:
      operationId: v1-get-project-legacy-api-keys
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyApiKeysResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
        - fga_permissions:
            - api_gateway_keys_read
      summary: >-
        Check whether JWT based legacy (anon, service_role) API keys are
        enabled. This API endpoint will be removed in the future, check for HTTP
        404 Not Found.
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:read'
          position: after
      x-endpoint-owners:
        - auth
        - management-api
      x-oauth-scope: secrets:read
    put:
      operationId: v1-update-project-legacy-api-keys
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
        - name: enabled
          required: true
          in: query
          description: Boolean string, true or false
          schema:
            example: true
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyApiKeysResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
        - fga_permissions:
            - api_gateway_keys_write
      summary: >-
        Disable or re-enable JWT based legacy (anon, service_role) API keys.
        This API endpoint will be removed in the future, check for HTTP 404 Not
        Found.
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - auth
        - management-api
      x-oauth-scope: secrets:write
  /v1/projects/{ref}/api-keys/{id}:
    patch:
      operationId: v1-update-project-api-key
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            example: 22222222-2222-4222-8222-222222222222
            type: string
        - name: reveal
          required: false
          in: query
          description: Boolean string, true or false
          schema:
            example: true
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
        - fga_permissions:
            - api_gateway_keys_write
      summary: Updates an API key for the project
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - auth
        - management-api
      x-oauth-scope: secrets:write
    get:
      operationId: v1-get-project-api-key
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            example: 22222222-2222-4222-8222-222222222222
            type: string
        - name: reveal
          required: false
          in: query
          description: Boolean string, true or false
          schema:
            example: true
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
        - fga_permissions:
            - api_gateway_keys_read
      summary: Get API key
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:read'
          position: after
      x-endpoint-owners:
        - auth
        - management-api
      x-oauth-scope: secrets:read
    delete:
      operationId: v1-delete-project-api-key
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            example: 22222222-2222-4222-8222-222222222222
            type: string
        - name: reveal
          required: false
          in: query
          description: Boolean string, true or false
          schema:
            example: true
            type: boolean
        - name: was_compromised
          required: false
          in: query
          description: Boolean string, true or false
          schema:
            example: false
            type: boolean
        - name: reason
          required: false
          in: query
          schema:
            example: rotating_key
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
        - fga_permissions:
            - api_gateway_keys_write
      summary: Deletes an API key for the project
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - auth
        - management-api
      x-oauth-scope: secrets:write
  /v1/projects/{ref}/secrets:
    get:
      description: Returns all secrets you've previously added to the specified project.
      operationId: v1-list-all-secrets
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to retrieve project's secrets
      security:
        - bearer: []
        - fga_permissions:
            - edge_functions_secrets_read
      summary: List all secrets
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:read'
          position: after
      x-endpoint-owners:
        - functions
      x-oauth-scope: secrets:read
    post:
      description: Creates multiple secrets and adds them to the specified project.
      operationId: v1-bulk-create-secrets
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretBody'
      responses:
        '201':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to create project's secrets
      security:
        - bearer: []
        - fga_permissions:
            - edge_functions_secrets_write
      summary: Bulk create secrets
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - functions
      x-oauth-scope: secrets:write
    delete:
      description: Deletes all secrets with the given names from the specified project
      operationId: v1-bulk-delete-secrets
      parameters:
        - name: ref
          required: true
          in: path
          description: Project ref
          schema:
            minLength: 20
            maxLength: 20
            pattern: ^[a-z]+$
            example: abcdefghijklmnopqrst
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSecretsBody'
      responses:
        '200':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Failed to delete secrets with given names
      security:
        - bearer: []
        - fga_permissions:
            - edge_functions_secrets_write
      summary: Bulk delete secrets
      tags:
        - Secrets
      x-badges:
        - name: 'OAuth scope: secrets:write'
          position: after
      x-endpoint-owners:
        - functions
      x-oauth-scope: secrets:write
components:
  schemas:
    ApiKeyResponse:
      type: object
      properties:
        api_key:
          type: string
          nullable: true
        id:
          type: string
          nullable: true
        type:
          type: string
          enum:
            - legacy
            - publishable
            - secret
          nullable: true
        prefix:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        hash:
          type: string
          nullable: true
        secret_jwt_template:
          type: object
          additionalProperties: {}
          nullable: true
        inserted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
        - name
    CreateApiKeyBody:
      type: object
      properties:
        type:
          type: string
          enum:
            - publishable
            - secret
        name:
          type: string
          minLength: 4
          maxLength: 64
          pattern: ^[a-z_][a-z0-9_]+$
        description:
          type: string
          nullable: true
        secret_jwt_template:
          type: object
          additionalProperties: {}
          nullable: true
      required:
        - type
        - name
      example:
        type: secret
        name: ci_secret_key
        description: CI deploy key
    LegacyApiKeysResponse:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    UpdateApiKeyBody:
      type: object
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 64
          pattern: ^[a-z_][a-z0-9_]+$
        description:
          type: string
          nullable: true
        secret_jwt_template:
          type: object
          additionalProperties: {}
          nullable: true
      example:
        name: ci_secret_key_rotated
        description: Rotated after March release
    SecretResponse:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        updated_at:
          type: string
      required:
        - name
        - value
    CreateSecretBody:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            maxLength: 256
            pattern: ^(?!SUPABASE_).*
            description: Secret name must not start with the SUPABASE_ prefix.
          value:
            type: string
            maxLength: 24576
        required:
          - name
          - value
      example:
        - name: OPENAI_API_KEY
          value: sk-example-secret
        - name: STRIPE_WEBHOOK_SECRET
          value: whsec_example
    DeleteSecretsBody:
      type: array
      items:
        type: string
      example:
        - OPENAI_API_KEY
servers: []
