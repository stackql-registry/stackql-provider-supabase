openapi: 3.0.0
info:
  title: organizations API
  description: Organizations related endpoints
  version: 1.0.0
paths:
  /v1/organizations:
    get:
      description: Returns a list of organizations that you currently belong to.
      operationId: v1-list-all-organizations
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1-list-all-organizationsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Unexpected error listing organizations
      security:
        - bearer: []
      summary: List all organizations
      tags:
        - Organizations
      x-badges:
        - name: 'OAuth scope: organizations:read'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - organizations_read
      x-oauth-scope: organizations:read
      x-stackql-bare-array-wrap:
        wrapperKey: v1_list_all_organizations
        wrapperName: V1-list-all-organizationsResponse
        mediaType: application/json
        scalar: false
    post:
      operationId: v1-create-an-organization
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationV1'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponseV1'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
        '500':
          description: Unexpected error creating an organization
      security:
        - bearer: []
      summary: Create an organization
      tags:
        - Organizations
      x-endpoint-owners:
        - control-plane
        - billing
      x-fga-permissions:
        - - organizations_create
  /v1/organizations/{slug}/entitlements:
    get:
      description: Returns the entitlements available to the organization based on their plan and any overrides.
      operationId: v1-get-organization-entitlements
      parameters:
        - name: slug
          required: true
          in: path
          description: Organization slug
          schema:
            pattern: ^[\w-]+$
            example: tsrqponmlkjihgfedcba
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ListEntitlementsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Get entitlements for an organization
      tags:
        - Organizations
      x-badges:
        - name: 'OAuth scope: organizations:read'
          position: after
      x-endpoint-owners:
        - billing
      x-fga-permissions:
        - - organization_admin_read
      x-oauth-scope: organizations:read
  /v1/organizations/{slug}/members:
    get:
      operationId: v1-list-organization-members
      parameters:
        - name: slug
          required: true
          in: path
          description: Organization slug
          schema:
            pattern: ^[\w-]+$
            example: tsrqponmlkjihgfedcba
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1-list-organization-membersResponse'
      security:
        - bearer: []
      summary: List members of an organization
      tags:
        - Organizations
      x-badges:
        - name: 'OAuth scope: organizations:read'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - members_read
      x-oauth-scope: organizations:read
      x-stackql-bare-array-wrap:
        wrapperKey: v1_list_organization_members
        wrapperName: V1-list-organization-membersResponse
        mediaType: application/json
        scalar: false
  /v1/organizations/{slug}:
    get:
      operationId: v1-get-an-organization
      parameters:
        - name: slug
          required: true
          in: path
          description: Organization slug
          schema:
            pattern: ^[\w-]+$
            example: tsrqponmlkjihgfedcba
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1OrganizationSlugResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Gets information about the organization
      tags:
        - Organizations
      x-badges:
        - name: 'OAuth scope: organizations:read'
          position: after
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - organization_admin_read
      x-oauth-scope: organizations:read
  /v1/organizations/{slug}/project-claim/{token}:
    get:
      operationId: v1-get-organization-project-claim
      parameters:
        - name: slug
          required: true
          in: path
          description: Organization slug
          schema:
            pattern: ^[\w-]+$
            example: tsrqponmlkjihgfedcba
            type: string
        - name: token
          required: true
          in: path
          schema:
            example: 0123456789abcdef0123456789abcdef01234567
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProjectClaimResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Gets project details for the specified organization and claim token
      tags:
        - Organizations
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - organization_admin_write
      x-internal: true
    post:
      operationId: v1-claim-project-for-organization
      parameters:
        - name: slug
          required: true
          in: path
          description: Organization slug
          schema:
            pattern: ^[\w-]+$
            example: tsrqponmlkjihgfedcba
            type: string
        - name: token
          required: true
          in: path
          schema:
            example: 0123456789abcdef0123456789abcdef01234567
            type: string
      responses:
        '204':
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden action
        '429':
          description: Rate limit exceeded
      security:
        - bearer: []
      summary: Claims project for the specified organization
      tags:
        - Organizations
      x-endpoint-owners:
        - control-plane
      x-fga-permissions:
        - - organization_admin_write
      x-internal: true
components:
  schemas:
    OrganizationResponseV1:
      type: object
      properties:
        id:
          type: string
          description: 'Deprecated: Use `slug` instead.'
          deprecated: true
        slug:
          type: string
          pattern: ^[\w-]+$
          description: Organization slug
          example: tsrqponmlkjihgfedcba
        name:
          type: string
      required:
        - id
        - slug
        - name
    CreateOrganizationV1:
      type: object
      properties:
        name:
          type: string
          maxLength: 256
      required:
        - name
      example:
        name: Acme
      additionalProperties: false
    V1ListEntitlementsResponse:
      type: object
      properties:
        entitlements:
          type: array
          items:
            type: object
            properties:
              feature:
                type: object
                properties:
                  key:
                    type: string
                    enum:
                      - instances.compute_update_available_sizes
                      - instances.read_replicas
                      - instances.disk_modifications
                      - instances.high_availability
                      - instances.orioledb
                      - replication.etl
                      - storage.max_file_size
                      - storage.max_file_size.configurable
                      - storage.image_transformations
                      - storage.vector_buckets
                      - storage.iceberg_catalog
                      - storage.purge_cache
                      - security.audit_logs_days
                      - security.questionnaire
                      - security.soc2_report
                      - security.iso27001_certificate
                      - security.private_link
                      - security.enforce_mfa
                      - log.retention_days
                      - custom_domain
                      - vanity_subdomain
                      - ipv4
                      - pitr.available_variants
                      - log_drains
                      - audit_log_drains
                      - branching_limit
                      - branching_persistent
                      - auth.mfa_phone
                      - auth.mfa_web_authn
                      - auth.mfa_enhanced_security
                      - auth.hooks
                      - auth.platform.sso
                      - auth.custom_jwt_template
                      - auth.saml_2
                      - auth.user_sessions
                      - auth.leaked_password_protection
                      - auth.advanced_auth_settings
                      - auth.performance_settings
                      - auth.password_hibp
                      - auth.custom_oauth.max_providers
                      - backup.retention_days
                      - backup.restore_to_new_project
                      - backup.schedule
                      - function.max_count
                      - function.size_limit_mb
                      - realtime.max_concurrent_users
                      - realtime.max_events_per_second
                      - realtime.max_joins_per_second
                      - realtime.max_channels_per_client
                      - realtime.max_bytes_per_second
                      - realtime.max_presence_events_per_second
                      - realtime.max_payload_size_in_kb
                      - project_scoped_roles
                      - security.member_roles
                      - project_pausing
                      - project_cloning
                      - project_restore_after_expiry
                      - assistant.advance_model
                      - integrations.github_connections
                      - integrations.github_push_webhooks_limit
                      - dedicated_pooler
                      - observability.dashboard_advanced_metrics
                      - api.members.invitations
                      - api.members.roles
                  type:
                    type: string
                    enum:
                      - boolean
                      - numeric
                      - set
                required:
                  - key
                  - type
              hasAccess:
                type: boolean
              type:
                type: string
                enum:
                  - boolean
                  - numeric
                  - set
              config:
                anyOf:
                  - type: object
                    properties:
                      enabled:
                        type: boolean
                    required:
                      - enabled
                  - type: object
                    properties:
                      enabled:
                        type: boolean
                      value:
                        type: number
                      unlimited:
                        type: boolean
                      unit:
                        type: string
                    required:
                      - enabled
                      - value
                      - unlimited
                      - unit
                  - type: object
                    properties:
                      enabled:
                        type: boolean
                      set:
                        type: array
                        items:
                          type: string
                    required:
                      - enabled
                      - set
            required:
              - feature
              - hasAccess
              - type
              - config
      required:
        - entitlements
    V1OrganizationMemberResponse:
      type: object
      properties:
        user_id:
          type: string
        user_name:
          type: string
        email:
          type: string
        role_name:
          type: string
        mfa_enabled:
          type: boolean
        avatar_url:
          type: string
          nullable: true
      required:
        - user_id
        - user_name
        - role_name
        - mfa_enabled
        - avatar_url
    V1OrganizationSlugResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        plan:
          type: string
          enum:
            - free
            - pro
            - team
            - enterprise
            - platform
        opt_in_tags:
          type: array
          items:
            enum:
              - AI_SQL_GENERATOR_OPT_IN
              - AI_DATA_GENERATOR_OPT_IN
              - AI_LOG_GENERATOR_OPT_IN
        allowed_release_channels:
          type: array
          items:
            type: string
            enum:
              - internal
              - alpha
              - beta
              - ga
              - withdrawn
              - preview
      required:
        - id
        - name
        - opt_in_tags
        - allowed_release_channels
    OrganizationProjectClaimResponse:
      type: object
      properties:
        project:
          type: object
          properties:
            ref:
              type: string
            name:
              type: string
          required:
            - ref
            - name
        preview:
          type: object
          properties:
            valid:
              type: boolean
            warnings:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  message:
                    type: string
                required:
                  - key
                  - message
            errors:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  message:
                    type: string
                required:
                  - key
                  - message
            info:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  message:
                    type: string
                required:
                  - key
                  - message
            members_exceeding_free_project_limit:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  limit:
                    type: number
                required:
                  - name
                  - limit
            source_subscription_plan:
              type: string
              enum:
                - free
                - pro
                - team
                - enterprise
                - platform
            target_subscription_plan:
              type: string
              enum:
                - free
                - pro
                - team
                - enterprise
                - platform
                - null
              nullable: true
          required:
            - valid
            - warnings
            - errors
            - info
            - members_exceeding_free_project_limit
            - source_subscription_plan
            - target_subscription_plan
        expires_at:
          type: string
        created_at:
          type: string
        created_by:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - project
        - preview
        - expires_at
        - created_at
        - created_by
    V1-list-all-organizationsResponse:
      type: object
      properties:
        v1_list_all_organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationResponseV1'
    V1-list-organization-membersResponse:
      type: object
      properties:
        v1_list_organization_members:
          type: array
          items:
            $ref: '#/components/schemas/V1OrganizationMemberResponse'
servers:
  - url: https://api.supabase.com/v1/projects/{ref}
    variables:
      ref:
        description: Supabase project reference (the Project ID shown in the dashboard under Settings -> General; 20 lowercase letters). Resolved from the SUPABASE_PROJECT_ID environment variable when it is set (x-stackQL-envVar); otherwise it must be supplied on every project-scoped query as WHERE ref = '<ref>'. A WHERE value always takes precedence over the environment.
        x-stackQL-envVar: SUPABASE_PROJECT_ID
